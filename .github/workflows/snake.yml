name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Custom Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23a855f7&color_dots=%23050712,%23111b3a,%23253675,%233b82f6,%2306d6c9
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23c084fc&color_dots=%23050712,%23111b3a,%23253675,%233b82f6,%2306d6c9

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
