    <!-- viewfinder corner brackets over the whole card -->
    <g stroke="#2EC4B6" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path class="bracket" d="M22,40 L22,22 L40,22"/>
      <path class="bracket" d="M878,40 L878,22 L860,22"/>
      <path class="bracket" d="M22,300 L22,318 L40,318"/>
      <path class="bracket" d="M878,300 L878,318 L860,318"/>
