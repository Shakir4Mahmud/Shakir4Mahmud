      <circle class="ring" cx="111" cy="202" r="53" fill="none" stroke="#2EC4B6" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity=".8"/>
      <text x="111" y="211" text-anchor="middle" class="chip" font-size="21" font-weight="600" fill="#0D0D0D"></text>
