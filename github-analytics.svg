<svg width="900" height="60" viewBox="0 0 900 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="50%" style="stop-color:#131318"/>
      <stop offset="100%" style="stop-color:#0D0D0D"/>
    </linearGradient>
    <linearGradient id="borderLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0"/>
      <stop offset="25%" style="stop-color:#FF6B35;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#2EC4B6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2EC4B6;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#2EC4B6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="60" rx="10" fill="url(#bg)"/>

  <!-- Top border line -->
  <rect x="0" y="0" width="900" height="2" rx="1" fill="url(#borderLine)"/>
  <!-- Bottom border line -->
  <rect x="0" y="58" width="900" height="2" rx="1" fill="url(#borderLine)"/>

  <!-- Left bracket -->
  <text x="22" y="42" font-family="Courier New, monospace" font-size="26" fill="#FF6B35" opacity="0.7" filter="url(#glow)">[</text>

  <!-- Bar chart icon (manual bars) -->
  <rect x="52" y="32" width="6" height="18" rx="1" fill="#FF6B35" opacity="0.8"/>
  <rect x="62" y="24" width="6" height="26" rx="1" fill="#FF6B35" opacity="0.9"/>
  <rect x="72" y="18" width="6" height="32" rx="1" fill="#FF6B35" opacity="1.0" filter="url(#glow)"/>
  <rect x="82" y="28" width="6" height="22" rx="1" fill="#2EC4B6" opacity="0.9"/>
  <rect x="92" y="22" width="6" height="28" rx="1" fill="#2EC4B6" opacity="1.0" filter="url(#glow)"/>

  <!-- Title text -->
  <text x="115" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700"
        fill="url(#textGrad)" letter-spacing="2" filter="url(#glow)">GitHub Analytics</text>

  <!-- Subtitle -->
  <text x="115" y="52" font-family="Arial, sans-serif" font-size="10" fill="#444" letter-spacing="3">REAL-TIME  ·  LIVE  DATA</text>

  <!-- Right side: dots/decoration -->
  <circle cx="770" cy="20" r="3" fill="#FF6B35" opacity="0.5"/>
  <circle cx="784" cy="20" r="3" fill="#FF6B35" opacity="0.7"/>
  <circle cx="798" cy="20" r="3" fill="#2EC4B6" opacity="0.9"/>

  <!-- Live indicator -->
  <circle cx="770" cy="40" r="5" fill="#27C93F" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="782" y="44" font-family="Courier New, monospace" font-size="11" fill="#27C93F" opacity="0.8">LIVE</text>

  <!-- Right bracket -->
  <text x="860" y="42" font-family="Courier New, monospace" font-size="26" fill="#2EC4B6" opacity="0.7" filter="url(#glow)">]</text>
</svg>
